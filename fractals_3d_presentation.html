<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>Фрактали та трикутник Серпінського — 3D презентація</title>
<style>
:root{--gold:#f2d28a;--ink:#fff8ea}
*{box-sizing:border-box}
html,body{margin:0;background:#05060d;overflow:hidden;height:100%;overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;color:var(--ink)}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,#fff7dd,#f2d28a 55%,#8a6a2a)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;transition:opacity .5s}
#hud.off{opacity:0}
#card{position:absolute;top:50%;width:min(430px,33vw);padding:22px 26px;border-radius:20px;background:linear-gradient(160deg,rgba(10,12,24,.52),rgba(10,12,24,.3));backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);border:1px solid rgba(242,210,138,.3);box-shadow:0 20px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);opacity:0;translate:0 -50%;transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1);transform:translateX(var(--sx,-30px))}
#card.left{left:5vw;--sx:-30px}#card.right{right:5vw;--sx:30px}
#card.show{opacity:1;transform:none}
#card.end{left:50%;top:32%;translate:-50% -50%;width:min(720px,88vw);text-align:center;padding:26px 34px;transform:translateY(20px)}
#card.end.show{transform:none}
#num{font-size:15px;letter-spacing:.3em;color:var(--gold);margin-bottom:10px;opacity:.9}
h2{font-size:clamp(24px,2.45vw,40px);line-height:1.15;margin:0 0 16px;font-weight:700;letter-spacing:.01em;text-shadow:0 2px 20px rgba(0,0,0,.45)}
h2::after{content:"";display:block;width:64px;height:2px;margin-top:14px;background:linear-gradient(90deg,var(--gold),transparent)}
#card.end h2{font-size:clamp(34px,5vw,66px);background:linear-gradient(180deg,#fff6d8,#e9bd62);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:18px}
#card.end h2::after{margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);width:140px}
#p{margin:0;font-size:clamp(13px,min(1.12vw,2vh),18px);line-height:1.55;color:#fbf3e2;text-shadow:0 1px 8px rgba(0,0,0,.55)}
#p .w{opacity:0;transition:opacity .5s ease;display:inline}
#p.in .w{opacity:1}
#card.end #p{font-size:clamp(15px,1.6vw,22px)}
#by{display:none;margin-top:16px;font-size:clamp(13px,1.2vw,18px);letter-spacing:.3em;text-transform:uppercase;color:#cfd6ee}
#by b{display:block;margin-top:8px;font-size:clamp(26px,3vw,46px);letter-spacing:.04em;text-transform:none;color:var(--gold);font-weight:700}
#card.end #by{display:block}
#fact{position:absolute;top:4vh;width:min(25vw,370px);padding:16px 20px;border-radius:16px;background:linear-gradient(160deg,rgba(40,28,8,.55),rgba(20,14,6,.35));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(242,210,138,.4);box-shadow:0 14px 50px rgba(0,0,0,.4),0 0 30px rgba(242,190,90,.12);opacity:0;transition:opacity .8s ease .6s;font-size:clamp(12px,min(1.02vw,1.9vh),16px);line-height:1.55;color:#fff3d6;text-shadow:0 1px 8px rgba(0,0,0,.5)}
#fact.show{opacity:1}
#fact.left{left:5vw}#fact.right{right:5vw}#fact.end{display:none}
#fact::before{content:"✦ ЦІКАВО ЗНАТИ";display:block;font-size:.78em;letter-spacing:.32em;color:var(--gold);margin-bottom:8px}
#gh{display:block;margin-top:10px;font-size:.78em;letter-spacing:.3em;color:var(--gold)}#gt{display:block;color:#ffe9bd}
#nav{position:fixed;right:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:11px;z-index:9}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.25);padding:0;cursor:pointer;transition:.3s}
.dot:hover{background:#fff}.dot.on{background:var(--gold);border-color:var(--gold);transform:scale(1.5);box-shadow:0 0 12px var(--gold)}
#cnt{position:fixed;left:26px;bottom:22px;z-index:9;font-size:14px;letter-spacing:.3em;color:rgba(255,255,255,.88);text-shadow:0 1px 6px #000}
.sb{position:fixed;bottom:20px;z-index:9;width:44px;height:44px;border-radius:50%;border:1px solid rgba(242,210,138,.5);background:rgba(10,12,24,.55);backdrop-filter:blur(8px);color:var(--gold);font-size:19px;cursor:pointer;transition:background .3s;font-family:inherit}.sb:hover{background:rgba(242,210,138,.25)}
#sound{right:20px}#sound::before{content:"♪"}#sound.off::before{content:"✕"}
#fs{right:74px}#fs::before{content:"⛶"}
.nb{position:fixed;bottom:22px;z-index:9;width:46px;height:46px;border-radius:50%;border:1px solid rgba(242,210,138,.5);background:rgba(10,12,24,.55);backdrop-filter:blur(8px);color:var(--gold);font-size:28px;line-height:1;cursor:pointer;transition:opacity .4s,background .3s;font-family:inherit}.nb:hover{background:rgba(242,210,138,.25)}#pv{left:calc(50% - 60px)}#nx{left:calc(50% + 14px)}
#hint{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:9;font-size:13px;letter-spacing:.2em;color:rgba(255,255,255,.75);text-shadow:0 1px 8px #000;pointer-events:none;transition:opacity 1s;white-space:nowrap}
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;background:radial-gradient(circle at 50% 40%,#1b2347,#05060d 70%);transition:opacity 1.1s,visibility 1.1s}
#intro.hide{opacity:0;visibility:hidden}
#intro .k{margin:0;color:#cfd6ee;font-size:clamp(13px,1.3vw,19px);letter-spacing:.4em}
#intro h1{font-size:clamp(30px,5.6vw,80px);line-height:1.08;margin:0;background:linear-gradient(180deg,#fff6d8,#e9bd62);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em}
#intro .who{color:#cfd6ee;font-size:clamp(13px,1.3vw,19px);letter-spacing:.2em}
#intro .who b{display:block;margin-top:4px;font-size:clamp(20px,2.2vw,32px);letter-spacing:.06em;color:var(--gold)}
#how{display:flex;flex-direction:column;gap:7px;color:#e8ecff;font-size:clamp(13px,1.2vw,18px)}
kbd{display:inline-block;min-width:28px;padding:2px 10px;border:1px solid rgba(242,210,138,.6);border-radius:7px;background:rgba(242,210,138,.12);color:#ffe9b0;font:inherit;font-size:.9em}
#lb{width:min(380px,70vw);height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}#lf{height:100%;width:0;background:linear-gradient(90deg,#f2d28a,#fff);transition:width .3s}
#lt{font-size:13px;color:#9aa6cc;min-height:18px}
#go{font:inherit;font-size:20px;letter-spacing:.18em;padding:13px 44px;border-radius:40px;border:1px solid var(--gold);background:rgba(242,210,138,.1);color:var(--gold);cursor:pointer;transition:.3s}
#go:hover:not(:disabled){background:var(--gold);color:#1a1405}#go:disabled{opacity:.35;cursor:wait}
#nosnd{background:none;border:0;color:#8f9ac0;font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
@media (max-width:900px),(max-height:520px){
  #card{width:min(46vw,420px);padding:14px 16px;border-radius:14px}
  #card.left{left:3vw}#card.right{right:3vw}
  #num{font-size:11px;margin-bottom:5px}
  h2{font-size:clamp(16px,5.2vh,26px);margin-bottom:8px}h2::after{margin-top:8px;width:44px}
  #p{font-size:clamp(10.5px,3.1vh,14px);line-height:1.42}
  #fact{display:none}
  #nav{right:8px;gap:7px}.dot{width:7px;height:7px}
  .sb{width:34px;height:34px;font-size:14px;bottom:10px}#sound{right:10px}#fs{right:50px}
  .nb{width:36px;height:36px;font-size:22px;bottom:10px}#cnt{left:12px;bottom:14px;font-size:11px}
  #hint{display:none}
  #card.end{padding:22px 16px}
}
@media (max-width:700px) and (orientation:portrait){
  #card,#card.left,#card.right{width:auto;left:4vw;right:4vw;top:auto;bottom:11vh;translate:0 0}
  #card.end{left:4vw;right:4vw;translate:0 0;width:auto;top:auto;bottom:11vh}
}
</style></head><body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="hud"><div id="card" class="left"><div id="num"></div><h2 id="h2"></h2><p id="p"></p><div id="by">Роботу виконав<b>Гречко Володимир</b></div></div>
<div id="fact" class="right"><span id="ft"></span><b id="gh">✦ МАЛО ВІДОМО</b><span id="gt"></span></div></div>
<div id="nav"></div><div id="cnt"></div>
<button id="sound" class="sb" title="Музика (M)"></button><button id="fs" class="sb" title="Повний екран (F)"></button>
<div id="hint">Пробіл / → — далі &nbsp;·&nbsp; ← — назад &nbsp;·&nbsp; H — сховати текст</div>
<button id="pv" class="nb" title="Назад">‹</button><button id="nx" class="nb" title="Далі">›</button>
<div id="intro"><p class="k">3D-ПРЕЗЕНТАЦІЯ</p><h1>Фрактали та<br>трикутник Серпінського</h1>
<div class="who">Роботу виконав<b>Гречко Володимир</b></div>
<div id="how"><span><kbd>Пробіл</kbd> або <kbd>→</kbd> — наступний слайд</span><span><kbd>←</kbd> — повернутись назад</span><span><kbd>F</kbd> повний екран · <kbd>M</kbd> звук · <kbd>H</kbd> сховати текст</span></div>
<div id="lb"><div id="lf"></div></div><div id="lt"></div>
<button id="go" disabled>Завантаження…</button><button id="nosnd">Без музики</button></div>

    else if(m==='waveL'){a[0].rotation.z=-2.55-s(t*7+ph)*.3;a[1].rotation.z=.08;}
    else if(m==='point'){a[1].rotation.x=-1.3+s(t*1.4)*.06;a[1].rotation.z=.3;a[0].rotation.z=-.08;}
    else if(m==='talk'){a[1].rotation.x=-.7+s(t*3.1+ph)*.35;a[1].rotation.z=.4;a[0].rotation.x=-.5+s(t*2.3+ph)*.3;a[0].rotation.z=-.4;}
    else if(m==='think'){a[1].rotation.x=-2.3;a[1].rotation.z=.25;a[0].rotation.z=-.07;}
    else if(m==='hold'){a[0].rotation.x=-1.0;a[1].rotation.x=-1.0;a[0].rotation.z=.25;a[1].rotation.z=-.25;}
    else if(m==='walk'){const w=s(t*5+ph);l[0].rotation.x=w*.6;l[1].rotation.x=-w*.6;a[0].rotation.x=-w*.5;a[1].rotation.x=w*.5;bob=Math.abs(w)*.04;}
    else if(m==='cheer'){a[0].rotation.z=-2.7+s(t*6+ph)*.2;a[1].rotation.z=2.7-s(t*6+ph)*.2;bob=Math.abs(s(t*5+ph))*.09;}

    else if(m==='carry'){a[1].rotation.z=.1;a[0].rotation.z=-.1;a[0].rotation.x=s(t*1.5+ph)*.03;}
    c.position.y=u.baseY+bob+down*(c.scale.y);
    u.head.getWorldPosition(_v);
    const ang=Math.atan2(camera.position.x-_v.x,camera.position.z-_v.z)-c.rotation.y-(c.parent?c.parent.rotation.y:0);
    const w=Math.atan2(Math.sin(ang),Math.cos(ang));
    u.head.rotation.y+=(clamp(w,-.8,.8)-u.head.rotation.y)*Math.min(1,dt*3);
    u.head.rotation.x=s(t*.8+ph)*.03+(u.lookUp?-.4:0);

const TRI_H=Math.sqrt(3)/2;

  text:'Влітку 1914 року Серпінський поїхав до Росії, а там почалась Перша світова війна. Як громадянина іншої держави, його не відпустили додому й змусили жити у місті В’ятка. Згодом друзі-математики допомогли переїхати до Москви, де він продовжив працювати.',

  fact:'Схожі візерунки з трикутників були в італійських мозаїках XIII століття — задовго до математиків.',

 {num:'VII',title:'Як його побудувати',side:'left',
  text:'1. Візьми рівносторонній трикутник. 2. З’єднай середини сторін — вийде 4 менші трикутники. 3. Вирізай середній. 4. З кожним трикутником, що залишився, роби те саме — знову й знову.',

 {num:'VIII',title:'Гра хаосу',side:'right',
  text:'Познач три вершини й будь-яку точку. Кидай кубик: обери одну з вершин і постав нову точку посередині між поточною та обраною вершиною. Повтори тисячі разів — із випадковості проступає трикутник Серпінського.',
  fact:'Хоч точки падають випадково, картинка щоразу виходить однаковою.',

 {num:'IX',title:'Трикутник Паскаля',side:'left',
  text:'У трикутнику Паскаля кожне число — це сума двох чисел над ним. Якщо зафарбувати лише непарні числа, проявиться трикутник Серпінського! Приховані зв’язки в математиці.',
  fact:'Непарні числа стоять за дуже суворим правилом, пов’язаним із двійковою системою.',
  rare:'Трикутник знали в Китаї та Персії задовго до Паскаля, але названо його на честь Блеза Паскаля (XVII століття).'},
 {num:'X',title:'Піраміда Серпінського',side:'right',
  text:'Те саме у просторі: з піраміди залишаємо 4 кутові піраміди вдвічі менші, і так далі. Об’єм щоразу зменшується вдвічі й прямує до нуля, а площа поверхні... не змінюється!',
  fact:'Розмірність піраміди Серпінського дорівнює рівно 2.',
  rare:'Щоб скласти її 4-го кроку з паперових тетраедрів, потрібно 256 маленьких пірамідок. Потягни піраміду мишею!'},
 {num:'XI',title:'Дивні властивості',side:'left',
  text:'Розмірність трикутника Серпінського — приблизно 1,585 (це ln 3 / ln 2). Площа з кожним кроком зменшується (залишається ¾), тож у межі вона дорівнює нулю, а довжина меж росте без обмеження — вона нескінченна.',
  fact:'Фігура «більша» за лінію, але «менша» за площину: її розмірність між 1 і 2.',
  rare:'Саме дробова розмірність дала назву фракталам — від латинського fractus.'},
 {num:'XII',title:'Де це застосовується',side:'right',
  text:'Антени у формі трикутника Серпінського працюють на кількох частотах одночасно. Фрактали допомагають малювати гори, хмари й дерева в кіно та іграх, стискати зображення та вивчати форму судин у медицині.',
  fact:'Гори у фільмах і іграх часто «вирощують» простим фрактальним алгоритмом.',
  rare:'Фрактальні антени запропонував Натан Коен наприкінці XX століття.'},
 {num:'',title:'Дякую за увагу!',side:'center',end:true,
  text:'З простого правила можна створити нескінченну красу. Математика — це справжня пригода.',fact:'',rare:''}
];
const N=SL.length;

/* ============ engine ============ */
const scenes=[],S={cur:-1,trans:null,tEnter:0,side:'left',vo:0,mx:0,my:0,tmx:0,tmy:0,ready:false,dir:1};
const tmpV=new T.Vector3(),tmpV2=new T.Vector3(),tmpC=new T.Color();
function applyMood(m){
  skyU.top.value.set(m.top);skyU.bot.value.set(m.bot);skyU.sunCol.value.set(m.sun);skyU.sunDir.value.set(...m.dir).normalize();skyU.stars.value=m.stars;skyU.cloud.value=m.cloud;
  scene.fog.color.set(m.fog);scene.fog.near=m.fn;scene.fog.far=m.ff;hemi.color.set(m.hs);hemi.groundColor.set(m.hg);hemi.intensity=m.hi;sun.color.set(m.sun);sun.intensity=m.si;renderer.toneMappingExposure=m.exp;
}
function swapTo(i,now){
  scenes.forEach((s,k)=>s.g.visible=k===i);S.cur=i;S.tEnter=now;applyMood(scenes[i].mood);S.side=SL[i].side;
}
/* --- cards --- */
const card=$('card'),factEl=$('fact');
function hideCard(){card.classList.remove('show');$('p').classList.remove('in');factEl.classList.remove('show');}
function showCard(i){
  const s=SL[i];
  card.className=(s.side==='center'?'end':s.side);
  $('num').textContent=s.num;$('h2').textContent=s.title;
  const p=$('p');p.innerHTML='';
  s.text.split(' ').forEach((w,k)=>{const sp=document.createElement('span');sp.className='w';sp.textContent=w+' ';sp.style.transitionDelay=(.5+k*.028)+'s';p.appendChild(sp);});
  if(s.fact){factEl.className=(s.side==='left'?'right':'left');$('ft').textContent=s.fact;$('gt').textContent=s.rare;}else factEl.className='end';
  void card.offsetWidth;card.classList.add('show');p.classList.add('in');if(s.fact)factEl.classList.add('show');
  $('cnt').textContent=String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
  [...$('nav').children].forEach((d,k)=>d.classList.toggle('on',k===i));
  $('pv').style.opacity=i>0?1:.3;$('nx').style.opacity=i<N-1?1:.3;
  try{history.replaceState(null,'','#'+(i+1));}catch(e){}
}
function go(i,instant){
  if(!S.ready||i<0||i>=N||i===S.cur||(S.trans&&!instant))return;
  S.dir=i>S.cur?1:-1;
  const now=performance.now()/1000;
  if(instant||S.cur<0){S.trans=null;$('flash').style.opacity=0;swapTo(i,now);showCard(i);Music.whoosh&&Music.whoosh();return;}
  S.trans={t:0,to:i,swapped:false};hideCard();Music.whoosh&&Music.whoosh();
  [...$('nav').children].forEach((d,k)=>d.classList.toggle('on',k===i));
}
const next=()=>go(S.cur+1),prev=()=>go(S.cur-1);

/* --- main loop --- */
let last=performance.now()/1000;
function frame(){
  requestAnimationFrame(frame);
  const now=performance.now()/1000,dt=Math.min(.05,now-last);last=now;
  if(S.cur<0)return;
  let warp=0,dolly=0;
  if(S.trans){const tr=S.trans;tr.t+=dt/1.7;const T1=Math.min(1,tr.t);warp=Math.sin(Math.PI*T1);
    $('flash').style.opacity=Math.pow(warp,2.2).toFixed(3);
    if(T1<.5)dolly=ease(T1*2)*26;
    if(T1>=.5&&!tr.swapped){tr.swapped=true;swapTo(tr.to,now);showCard(tr.to);}
    if(T1>=.5)dolly=-(1-ease((T1-.5)*2))*26;
    if(T1>=1){S.trans=null;$('flash').style.opacity=0;}}
  const sc=scenes[S.cur],tt=now-S.tEnter,o=sc.g.position;
  const cf=sc.cam(tt);
  S.mx+=(S.tmx-S.mx)*.05;S.my+=(S.tmy-S.my)*.05;
  tmpV.set(cf.p[0]+o.x,cf.p[1]+o.y,cf.p[2]+o.z);tmpV2.set(cf.t[0]+o.x,cf.t[1]+o.y,cf.t[2]+o.z);
  const fwd=tmpV2.clone().sub(tmpV).normalize();
  camera.position.copy(tmpV).addScaledVector(fwd,dolly);
  camera.position.x+=S.mx*.9;camera.position.y+=-S.my*.5+(coarse?0:0);
  camera.lookAt(tmpV2);
  camera.fov=cf.fov+warp*48;
  const W=innerWidth,H=innerHeight,target=(S.side==='left'?-1:S.side==='right'?1:0)*W*(W/H>1.15&&W>700?.15:.0);
  S.vo+=(target-S.vo)*.07;camera.setViewOffset(W,H,S.vo,0,W,H);camera.updateProjectionMatrix();
  // light follows the active scene
  const m=sc.mood;sun.position.set(o.x+m.dir[0]*60,o.y+m.dir[1]*60+10,o.z+m.dir[2]*60);sun.target.position.set(o.x,o.y,o.z);sun.target.updateMatrixWorld();
  sky.position.copy(camera.position);skyU.time.value=now;
  bloom.strength=m.bloom+warp*1.1;
  sc.update(now,dt,tt);animChars(now,dt);
  comp.render();
}
window.__go=i=>go(i,true);

/* --- drag (rotates the pyramids) --- */
let dragging=false,lx=0;
addEventListener('pointerdown',e=>{if(e.target.closest('button,#card,#fact,#intro'))return;dragging=true;lx=e.clientX;});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{S.tmx=(e.clientX/innerWidth-.5)*2;S.tmy=(e.clientY/innerHeight-.5)*2;if(dragging){drag.vel+=(e.clientX-lx)*.0016;lx=e.clientX;}});
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;S.tmx=clamp(e.gamma/25,-1,1);S.tmy=clamp(((e.beta||45)-45)/25,-1,1);});

/* ============ music ============ */
const Music=(function(){
  let ctx=null,master=null,timer=0,on=false,step=0,muted=false;
  const prog=[[196,246.94,293.66],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]],scale=[392,440,493.88,587.33,659.25,783.99];
  function init(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();master=ctx.createGain();master.gain.value=0;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;const dl=ctx.createDelay(1.5);dl.delayTime.value=.42;const fb=ctx.createGain();fb.gain.value=.34;const wet=ctx.createGain();wet.gain.value=.35;
    master.connect(lp);lp.connect(ctx.destination);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(ctx.destination);return true;}
  function pluck(f,t,v){const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);o.connect(g);o2.connect(g);g.connect(master);o.start(t);o2.start(t);o.stop(t+2.3);o2.stop(t+2.3);}
  function pad(f,t,d){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+d*.4);g.gain.linearRampToValueAtTime(0,t+d+1);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+1.1);}
  function bar(){const t=ctx.currentTime+.08,c=prog[step%4],beat=.75;c.forEach(f=>pad(f/2,t,6));[0,1,2,1,2,1,0,1].forEach((k,i)=>pluck(c[k%3]*(i%4===0?1:2),t+i*beat,i%2?.05:.07));
    if(Math.random()<.8)pluck(scale[(Math.random()*6)|0],t+beat*(2+(Math.random()*5|0)),.05);step++;}
  function whoosh(){if(!ctx||!on)return;const t=ctx.currentTime,len=Math.floor(ctx.sampleRate*1.5),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource();src.buffer=buf;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=.9;bp.frequency.setValueAtTime(250,t);bp.frequency.exponentialRampToValueAtTime(2400,t+.85);bp.frequency.exponentialRampToValueAtTime(300,t+1.5);
    const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.15,t+.75);g.gain.linearRampToValueAtTime(0,t+1.5);src.connect(bp);bp.connect(g);g.connect(ctx.destination);src.start(t);src.stop(t+1.55);}
  function label(){$('sound').classList.toggle('off',!on);}
  function start(){if(!ctx&&!init())return;ctx.resume();on=true;master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(master.gain.value,ctx.currentTime);master.gain.linearRampToValueAtTime(.32,ctx.currentTime+3);clearInterval(timer);bar();timer=setInterval(bar,6000);label();}
  function stop(){on=false;clearInterval(timer);if(ctx){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(master.gain.value,ctx.currentTime);master.gain.linearRampToValueAtTime(0,ctx.currentTime+.6);}label();}
  document.addEventListener('visibilitychange',()=>{if(!ctx||!on)return;document.hidden?ctx.suspend():ctx.resume();});
  return{start,stop,whoosh,toggle(){on?stop():start();},get on(){return on;}};
})();

/* ============ UI ============ */
for(let i=0;i<N;i++){const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','Слайд '+(i+1));b.onclick=()=>go(i);$('nav').appendChild(b);}
$('nx').onclick=e=>{next();e.currentTarget.blur();};$('pv').onclick=e=>{prev();e.currentTarget.blur();};
$('sound').onclick=e=>{Music.toggle();e.currentTarget.blur();};
async function enterFS(){const el=document.documentElement;try{if(el.requestFullscreen)await el.requestFullscreen({navigationUI:'hide'});else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();}catch(e){}try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}}
function toggleFS(){if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);}else enterFS();}
$('fs').onclick=e=>{toggleFS();e.currentTarget.blur();};
let started=false;
addEventListener('keydown',e=>{const k=e.key;
  if(!started){if((k===' '||k==='Enter')&&!$('go').disabled){e.preventDefault();$('go').click();}return;}
  if(k===' '||k==='Spacebar'){e.preventDefault();e.shiftKey?prev():next();}
  else if(['ArrowRight','ArrowDown','PageDown','Enter'].includes(k)){e.preventDefault();next();}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();prev();}
  else if(k==='Home')go(0);else if(k==='End')go(N-1);
  else if(['f','F','а','А'].includes(k))toggleFS();
  else if(['m','M','ь','Ь'].includes(k))Music.toggle();
  else if(['h','H','р','Р'].includes(k))$('hud').classList.toggle('off');});
let tx=0,ty=0;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{if(!started)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.4)dx<0?next():prev();},{passive:true});
let wl=0;addEventListener('wheel',e=>{if(!started)return;const n=performance.now();if(n-wl<1100||Math.abs(e.deltaY)<30)return;wl=n;e.deltaY>0?next():prev();},{passive:true});

/* ============ build world + intro ============ */
(async()=>{
  const setP=(p,s)=>{$('lf').style.width=p+'%';$('lt').textContent=s;};
  setP(6,'Будуємо світ фракталів…');await new Promise(r=>setTimeout(r,30));
  for(let i=0;i<SC.length;i++){
    setP(10+i/SC.length*80,`Сцена ${i+1} з ${SC.length}…`);await new Promise(r=>setTimeout(r,16));
    const g=new T.Group();g.position.copy(OFF(i));g.visible=false;scene.add(g);
    const inst=SC[i](g);inst.g=g;scenes.push(inst);
  }
  setP(92,'Готуємо світло та тіні…');await new Promise(r=>setTimeout(r,30));
  S.ready=true;swapTo(0,performance.now()/1000);
  scenes.forEach(s=>s.g.visible=false);scenes[0].g.visible=true;
  requestAnimationFrame(frame);
  // warm up every scene once so shaders compile before the first flight
  for(let i=0;i<SC.length&&!TEST;i++){scenes.forEach((s,k)=>s.g.visible=k===i);const o=scenes[i].g.position;camera.position.set(o.x,5,o.z+14);camera.lookAt(o.x,3,o.z);comp.render();setP(92+i*.6,'Компілюю шейдери…');await new Promise(r=>setTimeout(r,0));}
  swapTo(0,performance.now()/1000);
  setP(100,'Готово');$('go').disabled=false;$('go').textContent='Почати ▶';window.__ready=true;
  const begin=snd=>{if(started)return;started=true;enterFS();if(snd)Music.start();else $('sound').classList.add('off');
    $('intro').classList.add('hide');setTimeout(()=>$('intro').remove(),1300);
    const h=parseInt(location.hash.slice(1))||1;S.cur=-1;go(clamp(h-1,0,N-1),true);setTimeout(()=>{$('hint').style.opacity=0;},9000);};
  $('go').onclick=()=>begin(true);$('nosnd').onclick=()=>begin(false);
  if(TEST){started=true;$('intro').remove();S.cur=-1;go(0,true);}
})().catch(err=>{console.error(err);$('lt').textContent='Помилка: '+err.message;});
})();
</script>
